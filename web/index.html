<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="מודיעין בשבילך — סופר-אפליקציה עירונית">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מודיעין בשבילך">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>מודיעין בשבילך</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html { height: 100% }
    body { margin: 0; min-height: 100%; background-color: #ffffff; }
    /* PersonaAI's own bubble, its glow, its greeting and its pop-ups: the
       home page's "Ask" button opens the chat instead (the client, 5 Oct). */
    /* `html body` outranks the widget's own `#…{display:flex !important}`,
       which it adds after this. */
    html body #personaai-chat-button,
    html body #personaai-anim-layer,
    html body #personaai-welcome-bubble,
    html body #personaai-proactive-bubble { display: none !important; }
  </style>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <!-- PersonaAI Chat Widget — the client's, with his settings. Not on the
       admin panel. Its bubble is hidden (the style above): the home page's
       "Ask" button opens the chat through PersonaAI.open(). On the
       phone-width layout the chat window is raised above the bottom menu. -->
  <script>
    if (!/^\/(admin|login)/.test(location.pathname)) {
      window.PersonaAI = {
        businessId: "25ea67c7-94cd-4771-8f71-1d530bc7b2a1",
        position: "bottom-right",
        primaryColor: "#5B21E6",
        showWelcomeBubble: false,
        offsetBottom: window.innerWidth <= 1100 ? 92 : 20,
        offsetSide: 20
      };
      var personaAiScript = document.createElement('script');
      personaAiScript.src = 'https://personaai.me/widget.js';
      personaAiScript.async = true;
      // The widget then loads the business's saved settings (20 px from the
      // bottom), which replace the page's and put the bubble over the phone
      // layout's bottom menu. It has no "ready" signal, so the raised
      // offset is applied again for a while after it loads, and on resize.
      personaAiScript.onload = function () {
        function place() {
          if (window.PersonaAI && window.PersonaAI.setOffsetBottom) {
            window.PersonaAI.setOffsetBottom(window.innerWidth <= 1100 ? 92 : 20);
          }
        }
        var tries = 0;
        var timer = setInterval(function () {
          place();
          if (++tries >= 30) clearInterval(timer);
        }, 500);
        window.addEventListener('resize', place);
      };
      document.head.appendChild(personaAiScript);
    }
  </script>
  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
