name: modiin4u
description: "מודיעין בשבילך — סופר-אפליקציה עירונית מבוססת AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.17.2

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Map. latlong2 stays: the POI model and the web screens are built on it,
  # and google_maps_flutter's LatLng is a different type.
  google_maps_flutter: ^2.9.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.4
  fl_chart: ^1.2.0
  iconsax_plus: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

# ─── App Icon Generator ───
# Replace assets/images/app_icon.png with your branded 1024×1024 PNG,
# then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  # Adaptive icon (Android 8+) — foreground with padding on navy background
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A1230"
  # Remove alpha channel for iOS (App Store requirement)
  remove_alpha_ios: true
  # Web favicon
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

# ─── Native Splash Screen ───
# Replace assets/images/app_icon.png with your splash logo,
# then run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A1230"
  image: "assets/images/splash_logo.png"
  # Dark mode (same navy background)
  color_dark: "#0A1230"
  image_dark: "assets/images/splash_logo.png"
  # Android 12+ splash screen
  android_12:
    color: "#0A1230"
    image: "assets/images/splash_logo.png"
  # iOS splash
  ios: true
  # Web splash
  web: true

flutter:
  uses-material-design: true

  # Turns the ARB files in lib/l10n into the L class the screens read.
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

  # Declared here so `TextStyle(fontFamily: ...)` resolves them directly, and
  # kept in `assets:` above so anything still going through google_fonts finds
  # them locally instead of over the network.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/google_fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Rubik-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/google_fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Nunito-Bold.ttf
          weight: 700

