org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# R8 shrinks resources together with code (Play Console's recommendation,
# 26 Oct; the default from Android Gradle Plugin 9). Resources the app names
# only at run time must be listed in res/raw/keep.xml.
android.r8.optimizedResourceShrinking=true
