# Installed in /etc/nginx/conf.d/ (the http level): the page and photo
# caches and the request limits that proxy.conf uses (9 Oct).
#
# Every page of the Next.js site is drawn per request (the language is a
# cookie), and each one reads the database; on 9 Oct a crawl of every page
# saturated it. A page drawn once serves everyone for a minute — crawlers
# included — and the last good copy goes on being served while the
# database does not answer.
proxy_cache_path /var/cache/nginx/modiin4u-pages levels=1:2 keys_zone=modiin4u_pages:20m
                 max_size=1g inactive=1d use_temp_path=off;
# The photos made by /_next/image/: a copy never changes under its address.
proxy_cache_path /var/cache/nginx/modiin4u-photos levels=1:2 keys_zone=modiin4u_photos:20m
                 max_size=4g inactive=60d use_temp_path=off;

# Per visitor: pages at 10 a second (bursts of 40), photos at 40 (bursts of
# 200) — far above a person, below a scraper.
limit_req_zone $binary_remote_addr zone=modiin4u_page_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=modiin4u_photo_rate:10m rate=40r/s;
limit_req_status 429;

# Never cached: a search, the reader's own notifications, sign-in, invitations.
map $uri $modiin4u_no_cache {
    default            0;
    ~^/search/         1;
    ~^/notifications/  1;
    ~^/auth/           1;
    ~^/join/           1;
}
