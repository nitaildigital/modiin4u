# The public website, served by Next.js (deploy/next/modiin4u-site.service).
# Included in a server block instead of the Flutter build's snippet, for the
# addresses the public site answers on. The old WordPress images stay with
# nginx, as files; everything else goes to Next.js.
location ^~ /wp-content/uploads/ {
    root /var/www/modiin4u-uploads;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
