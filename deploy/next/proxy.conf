# The public website, served by Next.js (deploy/next/modiin4u-site.service).
# Included in a server block instead of the Flutter build's snippet, for the
# addresses the public site answers on. The old WordPress images stay with
# nginx, as files; everything else goes to Next.js. Needs cache.conf in
# /etc/nginx/conf.d/ (the caches and request limits used here).
location ^~ /wp-content/uploads/ {
    root /var/www/modiin4u-uploads;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
location /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# The photos the site makes (src/lib/photos.ts): each copy made once, then
# served by nginx.
location /_next/image/ {
    limit_req zone=modiin4u_photo_rate burst=200 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache modiin4u_photos;
    proxy_cache_valid 200 60d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache $upstream_cache_status always;
}
location / {
    limit_req zone=modiin4u_page_rate burst=40 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # A page drawn once serves everyone in its language for a minute; while
    # it is being drawn again, and while the site or the database fails, the
    # last good copy is served. Next marks its pages no-store for browsers,
    # which stays; nginx keeps its own copy regardless.
    proxy_cache modiin4u_pages;
    proxy_cache_key "$scheme$host$request_uri|lang=$cookie_lang";
    proxy_cache_valid 200 301 404 60s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache_bypass $modiin4u_no_cache;
    proxy_no_cache $modiin4u_no_cache;
    add_header X-Cache $upstream_cache_status always;
}
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
