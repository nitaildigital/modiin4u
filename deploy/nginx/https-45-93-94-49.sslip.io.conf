# Modiin4u over https at 45-93-94-49.sslip.io — the interim secure address
#
# sslip.io answers any name of the form a-b-c-d.sslip.io with the IP a.b.c.d,
# so this name reaches the server with no DNS record of ours, and Let's
# Encrypt issues certificates for it. It is here so the features a browser
# keeps to secure pages (the location behind "businesses near me") can be
# used before app.modiin4u.co.il has its record. The whole picture is at the
# top of app.modiin4u.co.il.conf.
#
# Switched on by `tool/enable_domain.sh 45-93-94-49.sslip.io`, which gets the
# certificate first. When the domain is live it can go: remove the link in
# /etc/nginx/sites-enabled, reload, and `certbot delete --cert-name
# 45-93-94-49.sslip.io` — or renewal will keep asking sslip.io for it.

server {
    listen 80;
    listen [::]:80;
    server_name 45-93-94-49.sslip.io;

    # Renewal arrives over http; answer it here rather than redirect it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://45-93-94-49.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 45-93-94-49.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/45-93-94-49.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/45-93-94-49.sslip.io/privkey.pem;
    ssl_session_cache   shared:modiin4u_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/modiin4u-site.conf;
}
