# Modiin4u — the bare domain, modiin4u.co.il: sent to www, as WordPress did,
# on http and https, path and query kept. Google's addresses are www's.
#
# Switched on by `tool/enable_domain.sh modiin4u.co.il` once the bare
# domain's A record at uPress points here; until then the https block is not
# linked in and its certificate does not exist.

server {
    listen 80;
    listen [::]:80;
    server_name modiin4u.co.il;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://www.modiin4u.co.il$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name modiin4u.co.il;

    ssl_certificate     /etc/letsencrypt/live/modiin4u.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/modiin4u.co.il/privkey.pem;
    ssl_session_timeout 1d;

    return 301 https://www.modiin4u.co.il$request_uri;
}
