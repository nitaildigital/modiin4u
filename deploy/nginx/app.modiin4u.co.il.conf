# Modiin4u — the web build (admin panel and the resident app)
#
# Static files only. Everything the app does goes straight to Supabase from
# the browser, so there is no application server here and nothing to keep
# running: nginx hands out files and that is all. What the site is — its
# folder, compression, caching and routing — is in snippets/modiin4u-site.conf,
# shared by every address below.
#
# ─── The addresses, and which are secure ───
#
# Browsers keep some features to secure (https) pages. The one that matters
# here is the visitor's location, which "businesses near me" asks for: on
# http://45.93.94.49 the browser refuses without asking. So the site answers
# three ways:
#
#   http://45.93.94.49            this file. Plain http, as it has always
#                                 been: it is the address in use today.
#   https://45-93-94-49.sslip.io  https-45-93-94-49.sslip.io.conf. sslip.io
#                                 is a public DNS service that answers that
#                                 name with the IP written in it, so it needs
#                                 no record of ours: a secure address to test
#                                 with before the domain exists.
#   https://app.modiin4u.co.il    https-app.modiin4u.co.il.conf, switched on
#                                 by tool/enable_domain.sh once the client
#                                 adds the `app` A record at uPress. Until
#                                 then the domain, if it reaches here at all,
#                                 lands on this file's http block.
#
# Each https-*.conf serves its name on 443 with its own Let's Encrypt
# certificate and sends that name's http there. Certificates come from
# `certbot certonly --webroot`, never `certbot --nginx`: the nginx plugin
# rewrites these files, and on a block that is also the bare IP's default it
# moves `listen 80` elsewhere and http://45.93.94.49 stops answering. With
# webroot certbot only drops a file in /var/www/letsencrypt, so what runs on
# the server stays exactly what is in this folder. Renewal is certbot's own
# timer (certbot.timer), which reloads nginx after a new certificate.
# Certificates and keys live in /etc/letsencrypt and never in the repo.
#
# Install — tool/enable_domain.sh does all of this; by hand:
#   cp snippets/modiin4u-site.conf /etc/nginx/snippets/
#   cp *.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/app.modiin4u.co.il.conf \
#         /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# An https-*.conf is linked into sites-enabled only once its certificate
# exists: nginx will not load a block whose certificate file is missing.

server {
    # `default_server` so the site answers on the machine's bare IP, and on
    # any name that has no block of its own. Only one site runs here, and
    # the IP is how a deploy is checked.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 45.93.94.49;

    include /etc/nginx/snippets/modiin4u-site.conf;
}

# https for a name we hold no certificate for — https://45.93.94.49, or the
# domain before its certificate — is refused at the handshake. Without this
# nginx would answer with whichever https block it read first, under that
# block's certificate and name.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
