# Modiin4u — the web build (admin panel and the resident app)
#
# Static files only. Everything the app does goes straight to Supabase from
# the browser, so there is no application server here and nothing to keep
# running: nginx hands out files and that is all.
#
# Install:
#   sudo cp app.modiin4u.co.il.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/app.modiin4u.co.il.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then certbot rewrites this file to add the TLS block:
#   sudo certbot --nginx -d app.modiin4u.co.il

server {
    listen 80;
    listen [::]:80;
    server_name app.modiin4u.co.il;

    root /var/www/modiin4u;
    index index.html;

    # ─── Compression ───
    #
    # A Flutter web build is mostly one large JavaScript file. Uncompressed it
    # is tens of megabytes; gzipped it is a fraction of that, and this is the
    # single biggest thing that decides how long the first load takes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/wasm
        image/svg+xml font/woff font/woff2;

    # Brotli beats gzip on this kind of payload, but it needs a module that
    # Ubuntu's nginx does not ship. Left off rather than half-configured; see
    # the note in deploy/README.md if it is worth adding later.

    # ─── Caching ───
    #
    # Flutter fingerprints most assets, so they can be cached hard. The two
    # files that must not be are index.html and the service worker: cache
    # those and a deploy does not reach anyone until their cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Routing ───
    #
    # The app uses real paths, not `/#/…` — see `usePathUrlStrategy()` in
    # lib/main.dart. So /auth/callback, /admin and every other route is a URL
    # the browser will actually ask this server for, and none of them exist
    # as files. Hand back index.html and let the app route it.
    #
    # Without this, the confirmation link in a sign-up email — which points at
    # /auth/callback — returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Headers ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;
}
