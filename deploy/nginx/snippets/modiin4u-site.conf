# Modiin4u — what the site is, whichever address it is reached by
#
# Included by every server block that serves the app: plain http on the
# bare IP (app.modiin4u.co.il.conf) and https on each name that has a
# certificate (https-*.conf). One copy, so the caching and routing rules
# below cannot drift apart between the addresses.
#
# Installed at /etc/nginx/snippets/modiin4u-site.conf.

root /var/www/modiin4u;
index index.html;

# ─── Let's Encrypt ───
#
# Certbot proves we control a name by putting a file under this path and
# having Let's Encrypt fetch it over http. The files live outside the site's
# folder because a deploy rsyncs there with --delete and would take them
# away, and a missing one is a 404 here instead of index.html from the
# routing below. `^~` so the caching rules' regexes cannot take the request.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}

# ─── App links ───
#
# Android and iOS fetch these to confirm the app may open this site's
# /join/<code> step group invitations (web/.well-known in the repo). Apple's
# has no extension, so its type is set here; and both answer 404 when
# missing rather than index.html, which a phone would read as a broken file.
location = /.well-known/apple-app-site-association {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

# ─── Compression ───
#
# A Flutter web build is mostly one large JavaScript file. Uncompressed it
# is tens of megabytes; gzipped it is a fraction of that, and this is the
# single biggest thing that decides how long the first load takes.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/wasm
    image/svg+xml font/woff font/woff2 font/ttf font/otf;

# Ubuntu's mime.types has no entry for .ttf or .otf, so the site's fonts
# went out as application/octet-stream — a type the list above does not
# name — and so uncompressed: 3.5 MB that Flutter downloads in full before
# it draws the first frame. Named, they gzip to 1.6 MB. Measured on 28
# September: the fonts alone took five seconds of a first visit.
#
# A `types` block replaces the inherited table rather than adding to it,
# so the standard one is included first and these two are added after.
include /etc/nginx/mime.types;
types {
    font/ttf ttf;
    font/otf otf;
}

# Brotli beats gzip on this kind of payload, but it needs a module that
# Ubuntu's nginx does not ship. Left off rather than half-configured; see
# the note in deploy/README.md if it is worth adding later.

# ─── Caching ───
#
# Flutter web does not fingerprint its output. `main.dart.js` is called
# `main.dart.js` in every build, `flutter_bootstrap.js` in every build,
# and index.html asks for them by those names with no version query. So
# anything that tells a browser to keep a copy is telling it to keep that
# build.
#
# This was set to `expires 30d` with `immutable` on every .js, which meant
# a deploy did not reach anybody who had opened the site before — for up
# to thirty days, with no way for them to know. Caught on 25 September:
# the server had the new bundle and the browser kept drawing the old one.
#
# `no-cache` is not `no-store`. The browser may keep its copy; it just has
# to ask first, and the answer is a 304 with no body while the build is
# unchanged. A 6MB bundle costs one conditional request, not 6MB.
location ~* ^/(index\.html|shell\.html|sitemap\.xml|robots\.txt|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
    add_header Cache-Control "no-cache" always;
    expires 0;
}

# Everything else — fonts, images, canvaskit, the asset bundle. These also
# carry stable names, so they are given a week rather than a month and
# never `immutable`: a browser that asks gets a 304, and a build that
# changes one of them is not invisible until October.
location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|json|bin|symbols)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    access_log off;
}

# ─── Routing ───
#
# The app uses real paths, not `/#/…` — see `usePathUrlStrategy()` in
# lib/main.dart. So /auth/callback, /admin and every other route is a URL
# the browser will actually ask this server for, and none of them exist
# as files. Hand back index.html and let the app route it.
#
# Without this, the confirmation link in a sign-up email — which points at
# /auth/callback — returns a 404.
#
# Every address Google should know has a page of its own, written by
# tool/build_seo_pages.py as <address>/index.html — the old site's
# /news/<slug>/, /business/<slug>/ and the rest — which `$uri/` finds.
# Everything else (the panel, sign-in, invitations) gets shell.html: the
# same app, marked noindex, with no title or canonical of a page it is not.
# The pages change with the content, so they are checked each visit too.
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /shell.html;
}

# The old WordPress addresses that moved, each with a 301 to its new page
# (tool/build_seo_pages.py --write-redirects; installed beside this file).
include /etc/nginx/snippets/modiin4u-seo-redirects.conf;

# ─── Headers ───
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

client_max_body_size 1m;
