# Modiin4u — the addresses the site had before launch: the bare IP
# (http://45.93.94.49) and https://45-93-94-49.sslip.io. Since 15 Oct they no
# longer serve a second copy of the site; every address 301s to the same
# path on www, so old invitation and notification links (/join/…, /news/…)
# still land.
#
# The app-link files stay served here: the apps already installed claim
# 45-93-94-49.sslip.io in their link filters, and older Android verifies all
# of an app's hosts or none — a failing host would stop www's links opening
# the app too. Drop them once a build without sslip.io is everyone's.
location = /.well-known/apple-app-site-association {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location ~ ^/(panel|admin|login)(/.*)?$ { return 301 https://panel.modiin4u.co.il$request_uri; }
location / { return 301 https://www.modiin4u.co.il$request_uri; }
