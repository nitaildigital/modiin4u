# Modiin4u — what an address serves since the Next.js site took over
# (13 Oct): the public website (site/, Next.js) at the root, and the admin
# panel — the Flutter web build — under /panel/ until it has an address of
# its own (panel.modiin4u.co.il). Included by each server block instead of
# modiin4u-site.conf, which served the Flutter build at the root and stays
# for going back.
#
# The panel's build is made with `--base-href /panel/` and installed in
# /var/www/modiin4u-panel/panel/, so its addresses map onto files with
# `root` (an `alias` would not reach the nested locations below).

location = /panel { return 301 /panel/; }
# The panel's old addresses (bookmarks, the panel's own links) — the site
# has no pages there.
location ~ ^/(admin|login)(/.*)?$ { return 301 /panel$request_uri; }
location ^~ /panel/ {
    root /var/www/modiin4u-panel;
    index index.html;
    # Fresh on every load, or a deploy reaches nobody until caches expire.
    location ~* ^/panel/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|firebase-messaging-sw\.js|version\.json)$ {
        add_header Cache-Control "no-cache" always;
        expires 0;
    }
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|json|bin|symbols)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }
    # The panel's own routes (/panel/admin, /panel/login) are the app's.
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /panel/index.html;
}

# The app links' files, from the site's public folder, as JSON — Apple reads
# its file without an extension and wants that type.
location = /.well-known/apple-app-site-association {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

include /etc/nginx/mime.types;
types {
    font/ttf ttf;
    font/otf otf;
}

# Everything else: the Next.js site (deploy/next/proxy.conf).
include /etc/nginx/snippets/modiin4u-next.conf;
