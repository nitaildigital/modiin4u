# Modiin4u — what the main addresses serve since the Next.js site took over
# (13 Oct): the public website (site/, Next.js). The admin panel — the
# Flutter web build — is on its own address. Included by each server block
# instead of modiin4u-site.conf, which served the Flutter build at the root
# and stays for going back.

# The panel has its own address now (https-panel.45-93-94-49.sslip.io.conf):
# its old ones here — /panel/…, and /admin… and /login… from bookmarks and
# the panel's own links — go there. (Under /panel/ it lived on this address
# from earlier on 13 Oct.)
location ~ ^/panel(/.*)?$ { return 301 https://panel.45-93-94-49.sslip.io$1$is_args$args; }
location ~ ^/(admin|login)(/.*)?$ { return 301 https://panel.45-93-94-49.sslip.io$request_uri; }

# The app links' files, from the site's public folder, as JSON — Apple reads
# its file without an extension and wants that type.
location = /.well-known/apple-app-site-association {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}
location = /.well-known/assetlinks.json {
    root /srv/modiin4u-site/public;
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
}

include /etc/nginx/mime.types;
types {
    font/ttf ttf;
    font/otf otf;
}

# Everything else: the Next.js site (deploy/next/proxy.conf).
include /etc/nginx/snippets/modiin4u-next.conf;
