# Modiin4u — the admin panel's own address (panel.45-93-94-49.sslip.io from
# 13 Oct, panel.modiin4u.co.il once it exists): the Flutter web build, built
# for the root (`--base-href /`, tool/deploy_web.sh), from
# /var/www/modiin4u-admin. Its front page is the panel's dashboard; the
# public website is the Next.js site on the main addresses.

root /var/www/modiin4u-admin;
index index.html;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}

# Not for search engines: the panel is a tool, not pages.
add_header X-Robots-Tag "noindex, nofollow" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

location = / { return 302 /admin; }

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/javascript
    application/javascript application/json application/wasm
    image/svg+xml font/woff font/woff2 font/ttf font/otf;

include /etc/nginx/mime.types;
types {
    font/ttf ttf;
    font/otf otf;
}

# Fresh on every load, or a deploy reaches nobody until caches expire.
location ~* ^/(index\.html|flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|firebase-messaging-sw\.js|version\.json)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    expires 0;
}
location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|otf|json|bin|symbols)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    access_log off;
}
# Thumbnails for the panel's lists, made by the website's resizer
# (site/src/lib/photos.ts) at the panel's own address, so the Flutter build
# may read them (www's answer carries no CORS header). The originals are up
# to 3.3 MB; Categories took 93.6 MB to draw 32-pixel pictures (16 Oct).
# The same proxy, cache and limit as www's (snippets/modiin4u-next.conf on
# the server), so a copy made for one serves the other. Needs cache.conf.
location ^~ /_next/image/ {
    limit_req zone=modiin4u_photo_rate burst=200 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host www.modiin4u.co.il;
    proxy_cache modiin4u_photos;
    proxy_cache_valid 200 60d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache $upstream_cache_status always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
# The app's routes (/admin, /login, /admin/…) are index.html's.
location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
}

client_max_body_size 1m;
