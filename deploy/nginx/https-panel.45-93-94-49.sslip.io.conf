# Modiin4u's admin panel over https at panel.45-93-94-49.sslip.io (13 Oct)
#
# sslip.io answers any name containing the IP with that IP, so this name
# reaches the server with no DNS record of ours, and Let's Encrypt issues it
# a certificate. The panel's own address until panel.modiin4u.co.il exists;
# the main addresses send /panel, /admin and /login here
# (snippets/modiin4u-public.conf).
#
# Switched on by `tool/enable_domain.sh panel.45-93-94-49.sslip.io`, which gets the
# certificate first. When the domain is live it can go: remove the link in
# /etc/nginx/sites-enabled, reload, and `certbot delete --cert-name
# panel.45-93-94-49.sslip.io` — or renewal will keep asking sslip.io for it.

server {
    listen 80;
    listen [::]:80;
    server_name panel.45-93-94-49.sslip.io;

    # Renewal arrives over http; answer it here rather than redirect it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://panel.45-93-94-49.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.45-93-94-49.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/panel.45-93-94-49.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.45-93-94-49.sslip.io/privkey.pem;
    ssl_session_cache   shared:modiin4u_tls:10m;
    ssl_session_timeout 1d;

    # The panel's Flutter build, at the root.
    include /etc/nginx/snippets/modiin4u-admin.conf;
}
