# Modiin4u's admin panel over https at panel.modiin4u.co.il (14 Oct, the
# launch day: the client added `panel` → 45.93.94.49 at uPress).
#
# Switched on by `tool/enable_domain.sh panel.modiin4u.co.il`, which gets the
# certificate first. panel.45-93-94-49.sslip.io, its address until now, and
# /panel, /admin and /login on the main addresses send people here
# (snippets/modiin4u-public.conf).

server {
    listen 80;
    listen [::]:80;
    server_name panel.modiin4u.co.il;

    # Renewal arrives over http; answer it here rather than redirect it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://panel.modiin4u.co.il$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.modiin4u.co.il;

    ssl_certificate     /etc/letsencrypt/live/panel.modiin4u.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.modiin4u.co.il/privkey.pem;
    ssl_session_cache   shared:modiin4u_tls:10m;
    ssl_session_timeout 1d;

    # The panel's Flutter build, at the root.
    include /etc/nginx/snippets/modiin4u-admin.conf;
}
