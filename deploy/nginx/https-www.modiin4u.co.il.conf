# Modiin4u's public website at https://www.modiin4u.co.il — the address
# Google knows (launch, after www's A record at uPress points here). The
# Next.js site, as on the IP (snippets/modiin4u-public.conf).
#
# Switched on by `tool/enable_domain.sh www.modiin4u.co.il`, which gets the
# certificate first. Renews by itself (certbot.timer).

server {
    listen 80;
    listen [::]:80;
    server_name www.modiin4u.co.il;

    # Renewal arrives over http; answer it here rather than redirect it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.modiin4u.co.il$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.modiin4u.co.il;

    ssl_certificate     /etc/letsencrypt/live/www.modiin4u.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.modiin4u.co.il/privkey.pem;
    ssl_session_cache   shared:modiin4u_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/modiin4u-public.conf;
}
