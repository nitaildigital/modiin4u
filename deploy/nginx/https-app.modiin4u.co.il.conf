# Modiin4u over https at app.modiin4u.co.il — the real address
#
# Waits in sites-available until the domain's A record exists (`app` →
# 45.93.94.49, added by the client at uPress; we have no access there).
# Then `tool/enable_domain.sh` checks the record, gets the certificate and
# links this file into sites-enabled. The whole picture is at the top of
# app.modiin4u.co.il.conf.
#
# From then on http://app.modiin4u.co.il is sent to https. The bare IP keeps
# its plain http: that is app.modiin4u.co.il.conf, and this file does not
# touch it.

server {
    listen 80;
    listen [::]:80;
    server_name app.modiin4u.co.il;

    # Renewal arrives over http; answer it here rather than redirect it.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://app.modiin4u.co.il$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.modiin4u.co.il;

    ssl_certificate     /etc/letsencrypt/live/app.modiin4u.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.modiin4u.co.il/privkey.pem;
    ssl_session_cache   shared:modiin4u_tls:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/modiin4u-site.conf;
}
